name: Automatización Energie Fitness

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Activa el botón manual que configuramos

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Copia los archivos de tu repositorio a la máquina virtual de GitHub
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Configura Python en la máquina virtual
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Cambia la versión si usas otra

      # 3. Instala las librerías que necesita tu script
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      # 4. Ejecuta tu script de Python pasándole tus 5 secretos guardados
      - name: Ejecutar script de automatización
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python exportar_resamania.py # ⚠️ REEMPLAZA 'main.py' POR EL NOMBRE REAL DE TU ARCHIVO PYTHON
